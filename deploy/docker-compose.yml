name: if3110_k01-4

services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: if3110-backend
    ports:
      - "${BACKEND_PORT:-9000}:9000"
      - "${METRICS_PORT:-9101}:9101"
    environment:
      PORT: "9000"
      METRICS_ADDR: "0.0.0.0:9101"
      DB_DSN: "host=db user=postgres password=postgres dbname=web_backend_db port=5432 sslmode=disable"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin-password"
      SESSION_HASH_KEY: "hash-key-0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      SESSION_BLOCK_KEY: "0123456789abcdef0123456789abcdef"
      DB_ENC_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: if3110-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: if3110-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.1
    container_name: if3110-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  db:
    image: postgres:16-alpine
    container_name: if3110-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_backend_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_backend_db"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

